[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# ✅ Important: Handle client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ✅ Important: Ensure static assets are served correctly
[[redirects]]
  from = "/_next/*"
  to = "/_next/*"
  status = 200

# ✅ Important: Cache static assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"